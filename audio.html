<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>audio render</title>
  </head>
  <body>
    <script type="module">
      import { renderStaffAudio } from './src/staff/audio.js';
      import { cues, livePiano, staffVideo, T, late, dark, quietParts } from './src/staff/staffConfig.js';
      window.__audio = {
        ready: true,
        async render(opts = {}) {
          const v = (t, v) => ({ t, v });
          const bgmPlan = {
            off: !!opts.noBgm,
            bpm: 96,
            // 区間ごとの曲の厚み。公演中（生演奏）は BGM を止める
            sections: [
              { from: 0, to: T.intro[1], vol: 0.8, arp: true, lead: false, drums: false },
              { from: T.reception[0], to: T.open[0], vol: 1, arp: true, lead: true, drums: true },
              { from: T.open[0], to: T.parking[0], vol: 1, arp: true, lead: true, drums: true },
              { from: T.parking[0], to: T.quiet[0], vol: 0.9, arp: true, lead: false, drums: true },
              { from: dark.end + 0.4, to: T.outro[0], vol: 0.6, arp: true, lead: false, drums: false },
              { from: T.outro[0], to: staffVideo.duration, vol: 0.9, arp: true, lead: true, drums: true },
            ],
            bus: [
              v(0, 0.0001), v(0.6, 0.55), v(T.intro[1] - 0.3, 0.55), v(T.intro[1] + 0.5, 0.6),
              v(T.parking[1] - 1.2, 0.6), v(T.quiet[0] - 0.2, 0.0001), v(T.quiet[0] + 0.1, 0.0001),
              v(dark.end, 0.0001), v(dark.end + 0.2, 0.0001), v(dark.end + 0.6, 0.5), v(T.outro[0] - 0.4, 0.5), v(T.outro[0] + 1, 0.62),
              v(staffVideo.duration - 1.5, 0.62), v(staffVideo.duration - 0.05, 0.0001),
            ],
          };
          return renderStaffAudio({ duration: staffVideo.duration, cues, livePiano, bgmPlan });
        },
      };
    </script>
  </body>
</html>
